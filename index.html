<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Perrier Korea &mdash; Monthly Reports</title>
<style>
  :root { --green:#00502D; --ink:#1a2b22; --muted:#6b7d73; --border:#dfe7e2; --surface:#fff; --bg:#f4f7f5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:640px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:22px; margin:0 0 4px; color:var(--green); }
  .sub { color:var(--muted); font-size:13.5px; margin:0 0 28px; }
  .rep { display:flex; justify-content:space-between; align-items:center;
          padding:16px 18px; margin-bottom:10px; background:var(--surface);
          border:1px solid var(--border); border-left:4px solid var(--green);
          border-radius:0 10px 10px 0; text-decoration:none; color:var(--ink); transition:.12s; }
  .rep:hover { box-shadow:0 2px 10px rgba(0,80,45,.10); transform:translateY(-1px); }
  .mo { font-weight:700; font-size:15.5px; }
  .arw { color:var(--green); font-size:13.5px; font-weight:600; }
  .foot { margin-top:28px; color:var(--muted); font-size:12px; }
</style></head>
<body><div class="wrap">
  <h1>Perrier Korea &mdash; Monthly Sales &amp; Stock Reports</h1>
  <p class="sub">Shindong Corp. &middot; each report is password-protected.</p>
    <a class="rep" href="./2026-07/"><span class="mo">July 2026</span><span class="arw">Open &rarr;</span></a>
    <a class="rep" href="./2026-06/"><span class="mo">June 2026</span><span class="arw">Open &rarr;</span></a>
  <p class="foot">Reports live under /YYYY-MM/. Password required to open each report.</p>
</div></body></html>
